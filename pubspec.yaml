name: hawalati
description: "تطبيق فخم ومستقل تماماً لتسجيل وإدارة الحوالات المالية دون الحاجة للاتصال بالإنترنت."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database & Secure Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Biometric Auth
  local_auth: ^2.1.8

  # Charts & UI Components
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0

  # Local Notifications & Exporting
  flutter_local_notifications: ^16.3.1
  pdf: ^3.10.7
  printing: ^5.11.1
  csv: ^5.1.0
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
