name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      # ⬇️⬇️⬇️ الخطوة الجديدة ⬇️⬇️⬇️
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      # ⬆️⬆️⬆️ الخطوة الجديدة ⬆️⬆️⬆️

      - name: Generate launcher icon PNGs
        run: |
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dens="${pair%%:*}"
            sz="${pair##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${dens}"
            convert -size "${sz}x${sz}" xc:'#2E7D6B' \
              -fill white -draw "circle $((sz/2)),$((sz/2)) $((sz/2)),$((sz/3))" \
              "android/app/src/main/res/mipmap-${dens}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${dens}/ic_launcher.png" \
               "android/app/src/main/res/mipmap-${dens}/ic_launcher_round.png"
          done
          ls -R android/app/src/main/res/mipmap-*

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hawalati-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
