# ============================================================
# إعدادات Gradle لمشروع حوالاتي
# ============================================================

# ذاكرة JVM المخصصة لـ Gradle Daemon (يمنع OutOfMemory)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# تفعيل التخزين المؤقت للبناء (يسرّع البناء التالي)
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# ============================================================
# إعدادات Android / Flutter
# ============================================================

# استخدم AndroidX (إجباري مع Flutter الحديث)
android.useAndroidX=true

# تعطيل Jetifier (غير مطلوب في المشاريع الحديثة ويسرّع البناء)
android.enableJetifier=false

# ============================================================
# 🔑 توافق Flutter مع AGP الحديث (ضروري لحل خطأ البناء)
# ============================================================

# تعطيل newDsl الافتراضي في AGP 9+ — Flutter Gradle plugin لا يزال غير متوافق معه
android.newDsl=false

# تعطيل built-in Kotlin في AGP — يجب استخدام kotlin-android plugin كما في المشروع
android.builtInKotlin=false
